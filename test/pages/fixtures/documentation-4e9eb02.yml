name: Curated documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy accepted main to production Pages (maintainer approval)'
        type: boolean
        default: false
      bootstrap:
        description: 'Initialize from an independently verified published Pages artifact'
        type: boolean
        default: false
      bootstrap_attested:
        description: 'I verified current publication, full namespace inventory, and drained writer queue'
        type: boolean
        default: false
      bootstrap_source_run:
        description: 'Verified production run ID (first attempt only)'
        type: string
      bootstrap_source_attempt:
        description: 'Verified production run attempt (must be 1)'
        type: string
      bootstrap_source_artifact:
        description: 'Verified github-pages artifact ID'
        type: string
      bootstrap_expected_root:
        description: 'Verified production root SHA-256'
        type: string
      bootstrap_expected_snapshot:
        description: 'Verified full published snapshot SHA-256'
        type: string
permissions:
  contents: read
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Pinned: Playwright 1.56 browser dependencies are installed per Ubuntu release.
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm run docs:check
      - run: npm run test:docs
      - run: node --test test/pages/*.test.mjs
      - run: python3 -B -m unittest discover -s test/pages -p '*_test.py'
      - run: npm ci --prefix docs/site
      - run: npm run docs:build
      - run: npm run docs:links
      - run: npx playwright install --with-deps chromium
        working-directory: docs/site
      - run: npm run test:e2e
        working-directory: docs/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        with:
          name: production-source-${{ github.run_attempt }}
          path: docs/site/dist/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: documentation-browser-failure
          path: docs/site/test-results/
  deploy:
    name: Deploy production snapshot
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: puzlwerk-pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      WRITER_MODE: production
      BOOTSTRAP_REQUESTED: ${{ inputs.bootstrap }}
      BOOTSTRAP_ATTESTED: ${{ inputs.bootstrap_attested }}
      BOOTSTRAP_SOURCE_RUN: ${{ inputs.bootstrap_source_run }}
      BOOTSTRAP_SOURCE_ATTEMPT: ${{ inputs.bootstrap_source_attempt }}
      BOOTSTRAP_SOURCE_ARTIFACT: ${{ inputs.bootstrap_source_artifact }}
      BOOTSTRAP_EXPECTED_ROOT: ${{ inputs.bootstrap_expected_root }}
      BOOTSTRAP_EXPECTED_SNAPSHOT: ${{ inputs.bootstrap_expected_snapshot }}
      PAGES_PREVIEWS_ENABLED: ${{ vars.PAGES_PREVIEWS_ENABLED }}
      PAGES_BOOTSTRAP_RUN: ${{ vars.PAGES_BOOTSTRAP_RUN }}
      PAGES_BOOTSTRAP_ATTEMPT: ${{ vars.PAGES_BOOTSTRAP_ATTEMPT }}
      PAGES_BOOTSTRAP_NONCE: ${{ vars.PAGES_BOOTSTRAP_NONCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: begin
        run: node scripts/pages/writer.mjs begin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.begin.outputs.legacy == 'false'
        with:
          name: pages-writer-start-${{ github.run_attempt }}
          path: writer-start/ledger.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.begin.outputs.legacy == 'false'
        with:
          name: production-source-${{ github.run_attempt }}
          path: production-source
      - if: steps.begin.outputs.legacy == 'false'
        run: node scripts/pages/writer.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.begin.outputs.legacy == 'false'
        with:
          name: pages-published-snapshot-${{ github.run_attempt }}
          path: combined-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.begin.outputs.legacy == 'false'
        with:
          name: combined-pages-${{ github.run_attempt }}
          path: combined-site
          include-hidden-files: true
      - if: steps.begin.outputs.legacy == 'false'
        run: node scripts/pages/writer.mjs check
      - name: Deploy explicitly approved main
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ steps.begin.outputs.legacy == 'true' && 'github-pages' || format('combined-pages-{0}', github.run_attempt) }}
      - if: steps.begin.outputs.legacy == 'false'
        run: node scripts/pages/writer.mjs finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.begin.outputs.legacy == 'false'
        with:
          name: pages-writer-commit-${{ github.run_attempt }}
          path: writer-commit/ledger.json
          if-no-files-found: error
          retention-days: 90
