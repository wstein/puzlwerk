name: Knowledge checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run docs:check
      - run: npm run test:docs
