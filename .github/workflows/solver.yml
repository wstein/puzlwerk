name: Solver checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test acceptance/test/native-cube-assembler.test.mjs acceptance/test/cube-assembler-raw-mesh.test.mjs acceptance/test/cube-assembler-shadow.test.mjs
      - run: node acceptance/test/cube-assembler-source-profile.mjs
      - run: npm run test:package
