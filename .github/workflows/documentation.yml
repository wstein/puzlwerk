name: Curated documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy accepted main to production Pages (maintainer approval)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Pinned: Playwright 1.56 browser dependencies are installed per Ubuntu release.
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm ci --prefix docs/site
      - run: npm run docs:build
      - run: npm run docs:links
      - run: npx playwright install --with-deps chromium
        working-directory: docs/site
      - run: npm run test:e2e
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: documentation-browser-failure
          path: docs/site/test-results/
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy explicitly approved main
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
