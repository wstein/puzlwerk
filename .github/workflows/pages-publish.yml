name: Reconcile acceptance previews
on:
  workflow_run:
    workflows: [Acceptance preview build]
    types: [completed]
  pull_request_target:
    types: [closed, reopened, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  signal:
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request trusted main reconciliation
        run: gh api --method POST repos/wstein/puzlwerk/actions/workflows/pages-publish.yml/dispatches -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    name: Publish preview snapshot
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: puzlwerk-pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      WRITER_MODE: preview
      PAGES_PREVIEWS_ENABLED: ${{ vars.PAGES_PREVIEWS_ENABLED }}
      PAGES_BOOTSTRAP_RUN: ${{ vars.PAGES_BOOTSTRAP_RUN }}
      PAGES_BOOTSTRAP_ATTEMPT: ${{ vars.PAGES_BOOTSTRAP_ATTEMPT }}
      PAGES_BOOTSTRAP_NONCE: ${{ vars.PAGES_BOOTSTRAP_NONCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/pages/writer.mjs begin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-writer-start-${{ github.run_attempt }}
          path: writer-start/ledger.json
          if-no-files-found: error
          retention-days: 90
      - run: node scripts/pages/writer.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-published-snapshot-${{ github.run_attempt }}
          path: combined-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: combined-pages-${{ github.run_attempt }}
          path: combined-site
          include-hidden-files: true
      - run: node scripts/pages/writer.mjs check
      - name: Deploy combined snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: combined-pages-${{ github.run_attempt }}
      - run: node scripts/pages/writer.mjs finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-writer-commit-${{ github.run_attempt }}
          path: writer-commit/ledger.json
          if-no-files-found: error
          retention-days: 90
